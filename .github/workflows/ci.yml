name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import and smoke checks
        run: |
          python examples/validate_imports.py
          python examples/validate_runtime_smoke.py
          python examples/validate_example_suite.py

      - name: Physics benchmarks
        run: python -m pytest

      - name: Build summary figures
        if: matrix.python-version == '3.12'
        env:
          MPLBACKEND: Agg
        run: python examples/plot_limit_landscape.py --n-mass 49 --n-mix 40 --out build/figures

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: summary-figures
          path: build/figures
